[project]
name = "garimpo"
version = "0.1.0"
description = "Descoberta de artistas underground com rota rastreável"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",  # o Form() do FastAPI depende disso
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
