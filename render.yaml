# Deploy no Render.
#
# Este app precisa de um processo que fica de pé — o garimpo leva ~70s numa
# tarefa de fundo, e o limite de 4 req/s do Last.fm mora na memória do
# processo. Serverless (Vercel e afins) não serve.
#
# ── Banco ──────────────────────────────────────────────────────────────────
# A configuração abaixo usa **Postgres externo**, que é o que viabiliza o
# plano gratuito. Crie um banco no Neon ou no Supabase e cole a URL em
# DATABASE_URL no painel. O app aceita `postgres://` e `postgresql://` — a
# normalização acontece no `app/db.py`.
#
# Alternativa com SQLite: troque `plan: free` por um plano pago, acrescente
#
#     disk:
#       name: dados
#       mountPath: /var/data
#       sizeGB: 1
#
# e ponha DATABASE_URL = sqlite:////var/data/garimpo.db. Disco persistente
# não existe no plano gratuito: lá o sistema de arquivos é apagado a cada
# deploy, e leva junto todas as contas e descobertas.
#
# ── Sobre o plano gratuito ─────────────────────────────────────────────────
# O serviço dorme depois de um tempo sem acesso, e a primeira visita demora
# a acordar. Uma rodada de garimpo deixada sozinha pode ser interrompida; o
# app detecta isso (veja LIMITE_DA_RODADA em app/web.py) e oferece tentar de
# novo, em vez de ficar preso em "garimpando…".

services:
  - type: web
    name: garimpo
    runtime: python
    plan: free
    region: oregon

    buildCommand: pip install -e .

    # as migrations rodam no start, não no build: no build o banco externo
    # pode nem estar acessível ainda
    startCommand: alembic upgrade head && uvicorn app.web:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      - key: AMBIENTE
        value: prod          # liga o Secure no cookie (o Render dá HTTPS)

      # as duas ficam só no painel, nunca no repositório
      - key: DATABASE_URL
        sync: false
      - key: LASTFM_API_KEY
        sync: false
