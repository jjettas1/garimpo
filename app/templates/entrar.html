{% extends "base.html" %}
{% block titulo %}entrar · garimpo{% endblock %}

{% block conteudo %}
  <div class="bloco"><h1>entrar</h1></div>

  <div class="bloco">
    {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}

    <form method="post" action="/entrar">
      <div class="campo">
        <label for="email">email</label>
        <input id="email" name="email" type="email" value="{{ email or '' }}"
               required autofocus autocomplete="email">
      </div>
      <div class="campo">
        <label for="senha">senha</label>
        <input id="senha" name="senha" type="password" required autocomplete="current-password">
      </div>
      <div class="acoes">
        <button class="principal" type="submit">entrar</button>
      </div>
    </form>
  </div>

  <div class="bloco legenda">
    ainda não tem conta? <a href="/cadastro">criar</a>
  </div>
{% endblock %}
